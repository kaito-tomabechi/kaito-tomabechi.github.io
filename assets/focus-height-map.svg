<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1732" viewBox="0 0 1600 1732" role="img" aria-labelledby="t d">
<title id="t">The microscope refocused at every device</title>
<desc id="d">Autofocus height map for the 18 September 2026 screening run. Each of 48 device positions in a 7 by 7 grid is coloured by the stage z the autofocus selected, relative to the median of all devices, on a single-hue scale from -12 to +12 micrometres. The selected heights span 22 micrometres across device positions spanning 3.8 mm. When 25 devices were refocused on a second pass 1.7 to 4.7 hours later, 20 came back within 1 micrometre (one stage step); one recovered device differed by 11 micrometres.</desc>
<rect width="1600" height="1732" fill="#ffffff"/>
<g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<text x="72.0" y="152.0" font-size="92" font-weight="700" fill="#152a35" text-anchor="start">The microscope refocused</text>
<text x="72.0" y="260.0" font-size="92" font-weight="700" fill="#152a35" text-anchor="start">at every device</text>
<text x="72.0" y="338.0" font-size="38" font-weight="400" fill="#526572" text-anchor="start">Stage height chosen by autofocus at each of 48 devices, 18 September overnight run</text>
<text x="72.0" y="508.0" font-size="120" font-weight="700" fill="#152a35" text-anchor="start">22 µm</text>
<text x="72.0" y="562.0" font-size="38" font-weight="400" fill="#526572" text-anchor="start">spread of focus heights</text>
<text x="72.0" y="608.0" font-size="38" font-weight="400" fill="#526572" text-anchor="start">over 3.8 mm of the chip</text>
<text x="800.0" y="508.0" font-size="120" font-weight="700" fill="#152a35" text-anchor="start">≤1 µm</text>
<text x="800.0" y="562.0" font-size="38" font-weight="400" fill="#526572" text-anchor="start">change for 20 of 25 devices</text>
<text x="800.0" y="608.0" font-size="38" font-weight="400" fill="#526572" text-anchor="start">refocused on a second pass</text>
