<title id="t">48 devices, 3 failures, all recovered by the agent</title>
<desc id="d">Operations map of one overnight device-screening run on 18 September 2026 (JST). A 7 by 7 grid of device positions: 45 devices completed without a device failure, 3 failed and were recovered by the resident agent, 1 position has no device. 240 images were accepted, 5 per device. The highlighted device failed with an image-save error at 02:42; the agent repaired the software and the device's five images were complete at 02:59. The 19 devices measured before it kept unchanged records. A timeline shows each device finishing between 00:41 and 05:19 JST.</desc>
