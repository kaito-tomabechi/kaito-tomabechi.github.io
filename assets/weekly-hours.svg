<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="140" viewBox="0 0 1120 140" role="img" aria-labelledby="wh-t wh-d">
<title id="wh-t">All logged automated runs: hours per week, May to October 2026</title>
<desc id="wh-d">Bar chart of all logged automated runs: hours in each Monday-start week (Japan time), from the week of 25 May to the week of 26 October 2026: 23 weeks, about 1,013 hours in total. Gridlines mark 40 and 80 hours per week. From June to October most weeks logged 20 to 85 hours; the busiest week, starting 7 September, logged 85 hours. The three weeks from 10 August were quiet, under 10 hours each. A bracket marks a single 66-hour unattended run from 18 to 20 July, split between the weeks of 13 July and 20 July.</desc>
