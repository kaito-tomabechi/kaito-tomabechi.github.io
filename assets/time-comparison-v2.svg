<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="570" viewBox="0 0 1440 570" role="img" aria-labelledby="title desc"><title id="title">Thin-film screening: manual work and unattended operation</title><desc id="desc">For the same thin-film screening workflow, 40 hours of manual work became 2 minutes of operator input plus 3 hours of unattended measurement. The two-minute figure is operator time, not total experimental duration. This is a reported workflow comparison, not a cell count claim or a general claim that every experiment needs no preparation.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M2 2 L8 5 L2 8" fill="none" stroke="#007f7c" stroke-width="1.7"/></marker><marker id="amber" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M2 2 L8 5 L2 8" fill="none" stroke="#c16a2c" stroke-width="1.7"/></marker><pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#d7e6e8" stroke-width="1"/></pattern><pattern id="cadgrid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#294452" stroke-width="1"/></pattern></defs><rect x="0" y="0" width="1440" height="570" rx="0" fill="#fff" stroke="none" stroke-width="2"/><g font-family="Arial, Helvetica, sans-serif"><text x="54" y="67" font-size="39" fill="#132e3b" font-weight="700" text-anchor="start">Same thin-film workflow. A different use of human time.</text><text x="54" y="112" font-size="27" fill="#325568" font-weight="400" text-anchor="start">Manual work, operator input, and unattended run time are distinct quantities.</text><path d="M54 145 H1386" fill="none" stroke="#c9dadf" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><text x="54" y="212" font-size="25" fill="#325568" font-weight="700" text-anchor="start">MANUAL WORKFLOW</text><text x="54" y="321" font-size="98" fill="#132e3b" font-weight="700" text-anchor="start">40</text><text x="194" y="321" font-size="43" fill="#132e3b" font-weight="700" text-anchor="start">hours</text><text x="54" y="373" font-size="30" fill="#132e3b" font-weight="400" text-anchor="start">Manual work</text><path d="M54 416 H400" fill="none" stroke="#c16a2c" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" /><path d="M443 310 H521" fill="none" stroke="#007f7c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="570" y="212" font-size="25" fill="#007f7c" font-weight="700" text-anchor="start">AI-ASSISTED WORKFLOW</text><text x="570" y="321" font-size="98" fill="#c16a2c" font-weight="700" text-anchor="start">2</text><text x="644" y="321" font-size="43" fill="#132e3b" font-weight="700" text-anchor="start">minutes</text><text x="570" y="373" font-size="30" fill="#132e3b" font-weight="400" text-anchor="start">Operator input</text><path d="M574 405V432" fill="none" stroke="#c16a2c" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" /><text x="898" y="319" font-size="47" fill="#325568" font-weight="400" text-anchor="start">+</text><text x="990" y="321" font-size="98" fill="#007f7c" font-weight="700" text-anchor="start">3</text><text x="1064" y="321" font-size="43" fill="#132e3b" font-weight="700" text-anchor="start">hours</text><text x="990" y="373" font-size="28" fill="#132e3b" font-weight="400" text-anchor="start">Unattended measurement</text><path d="M990 416 H1380" fill="none" stroke="#007f7c" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="2 20"/><path d="M54 472 H1386" fill="none" stroke="#c9dadf" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><text x="54" y="519" font-size="27" fill="#132e3b" font-weight="700" text-anchor="start">Two minutes of input. Three hours unattended.</text><text x="54" y="554" font-size="23" fill="#325568" font-weight="400" text-anchor="start">Reported thin-film case · preparation and measurement scope are workflow dependent · bars are not to scale</text></g></svg>
